<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Careers | CareerConnect India</title>
  <meta name="description" content="Search and discover Indian career options across Technology, Healthcare, Law, Civil Services, Science, Design, and Business.">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Global Shared Header -->
  <div id="siteHeaderMount"></div>

  <main style="padding: 3rem 0 5rem;">
    <div class="container">
      <div style="margin-bottom: 2.5rem;">
        <span class="section-eyebrow">CAREER DIRECTORY</span>
        <h1 style="font-size: 2.25rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem;">
          Explore In-Demand Careers in India
        </h1>
        <p style="font-size: 1.05rem; color: var(--text-muted); max-width: 720px;">
          Every career guide below includes verified entry routes (degree, diploma, or alternative), required entrance exams, skill checklists, average salaries, and official regulatory sources.
        </p>
      </div>

      <!-- Mount point for ExplorePage script -->
      <div id="exploreMount">
        <div class="card" style="text-align: center; padding: 3rem;">
          <p style="color: var(--text-muted);">Loading career database...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Global Shared Footer -->
  <div id="siteFooterMount"></div>

  <!-- Scripts -->
  <script type="module">
    import { SiteComponents } from './js/components.js';
    import { ExplorePage } from './js/explore-page.js';

    document.addEventListener('DOMContentLoaded', () => {
      SiteComponents.init('explore');
      ExplorePage.init();
    });
  </script>
</body>
</html>
