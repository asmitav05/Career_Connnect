<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Decorative Shapes -->
  <circle cx="400" cy="325" r="260" fill="url(#bgGlow)"/>
  <circle cx="620" cy="180" r="140" fill="#e0e7ff" opacity="0.6"/>
  <circle cx="160" cy="460" r="110" fill="#e0f2fe" opacity="0.7"/>

  <!-- Subtle Grid lines -->
  <path d="M120 325h560M400 85v480" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>
  <circle cx="400" cy="325" r="190" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Central Career & Education Pathway Emblems (Strictly Gender-Neutral, No Human Figures) -->
  <g id="centralPathwayEmblems" transform="translate(260, 150)">
    <!-- Shadow under books -->
    <ellipse cx="140" cy="370" rx="140" ry="24" fill="#cbd5e1" opacity="0.6"/>

    <!-- Stack of Educational Books -->
    <!-- Book 3 (Bottom - Science & Research) -->
    <rect x="30" y="310" width="220" height="42" rx="8" fill="#1e293b"/>
    <rect x="36" y="316" width="208" height="30" rx="4" fill="#334155"/>
    <rect x="238" y="314" width="10" height="34" rx="2" fill="#f8fafc"/>
    <text x="50" y="336" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">RESEARCH &amp; SCIENCE</text>

    <!-- Book 2 (Middle - Technology & Engineering) -->
    <rect x="45" y="265" width="210" height="42" rx="8" fill="url(#primaryGrad)"/>
    <rect x="52" y="271" width="196" height="30" rx="4" fill="#4338ca"/>
    <rect x="242" y="269" width="10" height="34" rx="2" fill="#f8fafc"/>
    <text x="65" y="291" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0e7ff" letter-spacing="1">TECH &amp; ENGINEERING</text>

    <!-- Book 1 (Top - Career Roadmaps) -->
    <rect x="60" y="220" width="200" height="42" rx="8" fill="url(#accentGrad)"/>
    <rect x="68" y="226" width="184" height="30" rx="4" fill="#0369a1"/>
    <rect x="246" y="224" width="10" height="34" rx="2" fill="#f8fafc"/>
    <text x="80" y="246" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe" letter-spacing="1">CAREER ROADMAPS</text>

    <!-- Graduation Cap / Mortarboard on Top -->
    <!-- Skull cap -->
    <path d="M120 180c0-10 18-18 40-18s40 8 40 18v25c0 10-18 18-40 18s-40-8-40-18z" fill="#0f172a"/>
    <!-- Diamond Top -->
    <polygon points="160,110 260,150 160,190 60,150" fill="#1e1b4b"/>
    <polygon points="160,114 252,150 160,186 68,150" fill="#312e81"/>
    <!-- Button on Top -->
    <circle cx="160" cy="150" r="7" fill="#6366f1"/>
    <!-- Tassel Ribbon & Fringe -->
    <path d="M160 150q40 15 55 45t10 40" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <rect x="220" y="235" width="10" height="22" rx="3" fill="#f59e0b"/>
    <circle cx="225" cy="235" r="5" fill="#d97706"/>

    <!-- Upward Career Pathway Arrow -->
    <g transform="translate(230, 80)">
      <path d="M0 80q30-40 50-70" fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>
      <polygon points="50,0 35,25 65,15" fill="#4f46e5"/>
    </g>
  </g>

  <!-- Floating Feature Card 1: Verified Scholarship -->
  <g transform="translate(60, 110)" filter="url(#cardShadow)">
    <rect width="210" height="96" rx="16" fill="#ffffff"/>
    <circle cx="40" cy="48" r="22" fill="#ecfdf5"/>
    <!-- Trophy / Award Icon -->
    <path d="M34 40h12v8c0 4-2 7-6 7s-6-3-6-7v-8zm-4 2h4v5c-2 0-4-2-4-5zm16 0h4c0 3-2 5-4 5v-5zm-8 15v5m-5 0h10" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <text x="74" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#059669">100% VERIFIED</text>
    <text x="74" y="56" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">AICTE Pragati</text>
    <text x="74" y="74" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">₹50,000 / year • Eligible</text>
  </g>

  <!-- Floating Feature Card 2: Transparent Career Match -->
  <g transform="translate(520, 90)" filter="url(#cardShadow)">
    <rect width="230" height="106" rx="16" fill="#ffffff"/>
    <circle cx="42" cy="53" r="22" fill="#eef2ff"/>
    <!-- Compass / Path Icon -->
    <circle cx="42" cy="53" r="12" stroke="#4f46e5" stroke-width="2"/>
    <path d="M47 48l-3 7-5 3 3-7 5-3z" fill="#4f46e5"/>
    <text x="76" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4f46e5">TOP CAREER FIT</text>
    <text x="76" y="58" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Software Engineer</text>
    <rect x="76" y="68" width="130" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="76" y="68" width="118" height="6" rx="3" fill="url(#primaryGrad)"/>
    <text x="76" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">94% Match • High Demand</text>
  </g>

  <!-- Floating Feature Card 3: Step-by-Step Roadmap Milestone -->
  <g transform="translate(540, 370)" filter="url(#cardShadow)">
    <rect width="210" height="96" rx="16" fill="#ffffff"/>
    <circle cx="38" cy="48" r="18" fill="#fef3c7"/>
    <!-- Checkmark / Milestone Flag -->
    <path d="M32 48l4 4 8-8" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#d97706">NEXT STEP THIS WEEK</text>
    <text x="68" y="56" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Entrance Registration</text>
    <text x="68" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">MHT CET / JEE Main</text>
  </g>

  <!-- Floating Feature Card 4: Student Profile Sync -->
  <g transform="translate(70, 410)" filter="url(#cardShadow)">
    <rect width="190" height="90" rx="16" fill="#ffffff"/>
    <circle cx="36" cy="45" r="18" fill="#e0f2fe"/>
    <!-- Profile / User Icon -->
    <circle cx="36" cy="41" r="6" fill="#0284c7"/>
    <path d="M26 53c0-4 4-6 10-6s10 2 10 6" fill="#0284c7"/>
    <text x="64" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0284c7">STUDENT PROFILE</text>
    <text x="64" y="54" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Class 12 • Science</text>
    <text x="64" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Local &amp; Private (No Spam)</text>
  </g>
</svg>
